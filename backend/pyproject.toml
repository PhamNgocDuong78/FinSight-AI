[project]
name = "finsight-backend"
version = "0.1.0"
description = "FinSight AI — Multimodal Financial Report Analysis Backend (Agentic RAG & Text-to-SQL)"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "qdrant-client>=1.12.0",
    "redis>=5.2.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
    "langgraph>=0.2.0",
    "pymupdf>=1.24.10",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

